<style>
/* HumAIn nav logo spotlight (Aniek Velthuizen with Claude, 2026-11-12; decisions/motion.md › Logo spotlight).
   Page load: a soft mint light slides once through the letters, left to right, 1.3 s. Hover (mouse only): the light follows the cursor inside the letters.
   The script below adds span.nav_logo_spot over each nav logo svg, masked by the logo's own paths, and sets data-state="sweep" | "hover". */
@property --logo-spot-x { syntax: '<length-percentage>'; inherits: false; initial-value: -30%; }
@property --logo-spot-y { syntax: '<length-percentage>'; inherits: false; initial-value: 50%; }
@property --logo-spot-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
.nav_component { --logo-spot-color: var(--swatch--brand-accent-700); }
.nav_component[data-nav-theme="dark"]:not([data-nav-scrolled]):not([data-nav-menu-open]) { --logo-spot-color: var(--swatch--brand-accent-500); }
[data-logo-spot-host] { position: relative; }
.nav_logo_spot {
  position: absolute; inset: 0; pointer-events: none;
  -webkit-mask: var(--logo-spot-mask) center / contain no-repeat; mask: var(--logo-spot-mask) center / contain no-repeat;
  background: radial-gradient(circle var(--logo-spot-r) at var(--logo-spot-x) var(--logo-spot-y), var(--logo-spot-color) 0%, color-mix(in srgb, var(--logo-spot-color) 85%, transparent) 35%, transparent 100%);
  transition: --logo-spot-r 320ms cubic-bezier(.22, 1, .36, 1);
}
.nav_logo_spot[data-state="sweep"] { animation: logo-spot-sweep 1.3s cubic-bezier(.65, 0, .35, 1) both; }
.nav_logo_spot[data-state="hover"] { --logo-spot-r: var(--logo-spot-hover, 0px); }
@keyframes logo-spot-sweep {
  from { --logo-spot-x: -27%; --logo-spot-y: 50%; --logo-spot-r: var(--logo-spot-size, 0px); }
  to   { --logo-spot-x: 127%; --logo-spot-y: 50%; --logo-spot-r: var(--logo-spot-size, 0px); }
}
@media (prefers-reduced-motion: reduce) { .nav_logo_spot { display: none; } }
</style>
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var VB_W = 514.552;
  function init() {
    var nav = document.querySelector('[data-nav="component"]');
    if (!nav) return;
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    nav.querySelectorAll('.nav_desktop_logo svg, .nav_mobile_logo svg').forEach(function (svg) {
      if (svg.hasAttribute('data-logo-spot')) return;
      svg.setAttribute('data-logo-spot', '');
      var host = svg.parentElement;
      host.setAttribute('data-logo-spot-host', '');
      var spot = document.createElement('span');
      spot.className = 'nav_logo_spot';
      spot.setAttribute('aria-hidden', 'true');
      var paths = Array.prototype.map.call(svg.querySelectorAll('path'), function (p) { return "<path d='" + p.getAttribute('d') + "'/>"; }).join('');
      var mask = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='" + svg.getAttribute('viewBox') + "'>" + paths + '</svg>';
      spot.style.setProperty('--logo-spot-mask', 'url("data:image/svg+xml,' + encodeURIComponent(mask) + '")');
      host.appendChild(spot);
      // Light radius in px, from the logo width (as the prototype: 120 / 110 of the 514 wide viewBox)
      function size() {
        var w = svg.getBoundingClientRect().width;
        spot.style.setProperty('--logo-spot-size', (w * 120 / VB_W).toFixed(1) + 'px');
        spot.style.setProperty('--logo-spot-hover', (w * 110 / VB_W).toFixed(1) + 'px');
      }
      function move(e) {
        var r = spot.getBoundingClientRect();
        spot.style.setProperty('--logo-spot-x', (e.clientX - r.left).toFixed(1) + 'px');
        spot.style.setProperty('--logo-spot-y', (e.clientY - r.top).toFixed(1) + 'px');
      }
      spot.addEventListener('animationend', function () { if (spot.getAttribute('data-state') === 'sweep') spot.removeAttribute('data-state'); });
      setTimeout(function () { if (!spot.hasAttribute('data-state')) { size(); spot.setAttribute('data-state', 'sweep'); } }, 400);
      if (fine) {
        var link = svg.closest('a') || host;
        link.addEventListener('pointerenter', function (e) { size(); move(e); spot.setAttribute('data-state', 'hover'); });
        link.addEventListener('pointermove', move);
        link.addEventListener('pointerleave', function () { spot.removeAttribute('data-state'); });
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
