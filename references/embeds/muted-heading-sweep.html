<style>
/* Two-tone heading words (decisions/motion.md): the grey (_muted) or turquoise (sticky-steps_accent) part of a heading starts in the heading's own colour; when it scrolls into view its words take their colour one by one. Runtime only; the Designer shows the finished colours. */
html[data-muted-gate] :is(h1,h2,h3,h4)>:is([class*="_muted"],.sticky-steps_accent):not([data-muted]){color:inherit;opacity:1}
:is([data-muted="ready"],[data-muted="in"]){opacity:1}
:is([data-muted="ready"],[data-muted="in"]) [data-muted-word]{color:var(--mm-from)}
[data-muted="in"] [data-muted-word]{color:var(--mm-to);transition:color .6s cubic-bezier(.45,0,.2,1) calc(var(--mm-delay,.1s) + var(--mm-i,0) * .14s)}
</style>
<script>
(function(){
var d=document,h=d.documentElement,SEL=':is(h1,h2,h3,h4)>:is([class*="_muted"],.sticky-steps_accent)';
if(h.classList.contains('wf-design-mode')||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
h.setAttribute('data-muted-gate','');
var guard=setTimeout(function(){h.removeAttribute('data-muted-gate')},4000);
function rgba(c){var m=c.match(/[\d.]+/g)||[0,0,0];return[+m[0],+m[1],+m[2],m[3]==null?1:+m[3]]}
function done(el){el.setAttribute('data-muted','done');['--mm-from','--mm-to','--mm-delay'].forEach(function(p){el.style.removeProperty(p)})}
function split(el){
  var walk=d.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[],n,i=0;
  while((n=walk.nextNode()))nodes.push(n);
  nodes.forEach(function(t){
    var f=d.createDocumentFragment();
    t.nodeValue.split(/(\s+)/).forEach(function(p){
      if(!p)return;
      if(/^\s+$/.test(p)){f.appendChild(d.createTextNode(p));return}
      var s=d.createElement('span');s.setAttribute('data-muted-word','');s.style.setProperty('--mm-i',i++);s.textContent=p;f.appendChild(s);
    });
    t.parentNode.replaceChild(f,t);
  });
  return i;
}
function init(){
  clearTimeout(guard);
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;
    var el=e.target;io.unobserve(el);
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      el.setAttribute('data-muted','in');
      setTimeout(function(){done(el)},(parseFloat(el.style.getPropertyValue('--mm-delay'))||.1)*1000+el._mmWords*140+800);
    })});
  })},{rootMargin:'0px 0px -15% 0px'});
  d.querySelectorAll(SEL).forEach(function(el){
    el.setAttribute('data-muted','probe');
    var cs=getComputedStyle(el),t=rgba(cs.color),op=+cs.opacity,from=getComputedStyle(el.parentElement).color;
    var to='rgba('+t[0]+','+t[1]+','+t[2]+','+(t[3]*op)+')';
    if(rgba(to).join()===rgba(from).join()){done(el);return}
    el._mmWords=split(el);
    el.style.setProperty('--mm-from',from);
    el.style.setProperty('--mm-to',to);
    if(el.closest('[data-hero-reveal]'))el.style.setProperty('--mm-delay','.6s');
    el.setAttribute('data-muted','ready');
    io.observe(el);
  });
  h.removeAttribute('data-muted-gate');
}
d.readyState==='loading'?d.addEventListener('DOMContentLoaded',init):init();
})();
</script>
