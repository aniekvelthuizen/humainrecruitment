<style>
/* Two-tone headings light up (decisions/motion.md): in a heading with a grey (_muted) or turquoise (sticky-steps_accent) part, and in the Card Grid closing statement and closing text, the words start dimmed (the grey of the _muted part; half the text colour where there is none). When the block scrolls into view the words light up one by one to their own colour; the _muted part stays grey. Runtime only; the Designer shows the finished colours. */
html[data-muted-gate] :is(h1,h2,h3,h4,.card-grid_statement-text,.card-grid_closing-text):has(>[class*="_muted"],>.card-grid_statement-muted,>.sticky-steps_accent):not([data-muted])>:not([class*="_muted"],.card-grid_statement-muted){color:color-mix(in srgb,currentColor 50%,transparent)}
[data-muted="ready"] [data-muted-word]{color:var(--mm-from)}
[data-muted="in"] [data-muted-word]{transition:color .6s cubic-bezier(.45,0,.2,1) calc(var(--mm-delay,.1s) + var(--mm-i,0) * var(--mm-step,.14s))}
</style>
<script>
(function(){
var d=document,h=d.documentElement,SEL=':is(h1,h2,h3,h4,.card-grid_statement-text,.card-grid_closing-text):has(>[class*="_muted"],>.card-grid_statement-muted,>.sticky-steps_accent)',MUTED=':is([class*="_muted"],.card-grid_statement-muted)';
if(h.classList.contains('wf-design-mode')||!('IntersectionObserver' in window)||!(window.CSS&&CSS.supports&&CSS.supports('selector(:has(a))'))||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
h.setAttribute('data-muted-gate','');
var guard=setTimeout(function(){h.removeAttribute('data-muted-gate')},4000);
function rgba(c){var m=c.match(/[\d.]+/g)||[0,0,0];return[+m[0],+m[1],+m[2],m[3]==null?1:+m[3]]}
function css(c){return'rgba('+c.join(',')+')'}
function done(el){el.setAttribute('data-muted','done');['--mm-from','--mm-delay','--mm-step'].forEach(function(p){el.style.removeProperty(p)})}
/* Split every text node outside the _muted part into word spans; returns the word count */
function split(el){
  var walk=d.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:function(t){var p=t.parentElement;return p&&p!==el&&p.closest(MUTED)&&el.contains(p.closest(MUTED))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),nodes=[],n,i=0;
  while((n=walk.nextNode()))nodes.push(n);
  nodes.forEach(function(t){
    if(!/\S/.test(t.nodeValue))return;
    var f=d.createDocumentFragment();
    t.nodeValue.split(/(\s+)/).forEach(function(p){
      if(!p)return;
      if(/^\s+$/.test(p)){f.appendChild(d.createTextNode(p));return}
      var s=d.createElement('span');s.setAttribute('data-muted-word','');s.style.setProperty('--mm-i',i++);s.textContent=p;f.appendChild(s);
    });
    t.parentNode.replaceChild(f,t);
  });
  return i;
}
function init(){
  clearTimeout(guard);
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;
    var el=e.target;io.unobserve(el);
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      el.setAttribute('data-muted','in');
      setTimeout(function(){done(el)},((parseFloat(el.style.getPropertyValue('--mm-delay'))||.1)+el._mmWords*(parseFloat(el.style.getPropertyValue('--mm-step'))||.14))*1000+800);
    })});
  })},{rootMargin:'0px 0px -15% 0px'});
  d.querySelectorAll(SEL).forEach(function(el){
    el.setAttribute('data-muted','probe');
    var m=el.querySelector(':scope>'+MUTED),from;
    if(m){var cs=getComputedStyle(m),c=rgba(cs.color);c[3]*=+cs.opacity;from=c}
    else{from=rgba(getComputedStyle(el).color);from[3]*=.5}
    var n=split(el);
    if(!n){done(el);return}
    el._mmWords=n;
    el.style.setProperty('--mm-from',css(from));
    el.style.setProperty('--mm-step',(n>1?Math.min(.14,1.8/(n-1)):.14).toFixed(3)+'s');
    if(el.closest('[data-hero-reveal]'))el.style.setProperty('--mm-delay','.6s');
    el.setAttribute('data-muted','ready');
    io.observe(el);
  });
  h.removeAttribute('data-muted-gate');
}
d.readyState==='loading'?d.addEventListener('DOMContentLoaded',init):init();
})();
</script>
