<style>
/* Stagger Cards motion (all variants) — owner (Aniek), 2026-11-12: cards rise in one by one, the icons keep moving.
   The script embed next to this one sets data-stagger-motion on the section; without it (Designer, reduced motion, no JS) nothing here applies.
   Off: remove the script embed. */
[data-stagger-motion] .stagger-cards_list > * > * { transition: translate .8s cubic-bezier(.22,1,.36,1) var(--stagger-delay, 0s); }
[data-stagger-motion] .stagger-cards_list .card_primary_element { transition: opacity .8s cubic-bezier(.22,1,.36,1) var(--stagger-delay, 0s); }
[data-stagger-motion="ready"] .stagger-cards_list > * > :not([data-stagger-in]) { translate: 0 1.5rem; }
[data-stagger-motion="ready"] .stagger-cards_list > * > :not([data-stagger-in]) .card_primary_element { opacity: 0; }

/* Icons: the masked icon becomes an inline SVG with moving parts. */
[data-icon-motion] { -webkit-mask-image: none; mask-image: none; background-color: transparent; }
[data-icon-motion] svg { display: block; width: 100%; height: 100%; overflow: visible; }
[data-icon-motion] svg * { transform-box: view-box; }
[data-stagger-paused] [data-icon-motion] svg * { animation-play-state: paused; }

/* Clock: the minute hand turns once every 8 s, the hour hand once every 96 s. */
[data-icon-part="minute"], [data-icon-part="hour"] { transform-origin: 12px 12px; animation: stagger-spin 8s linear infinite; }
[data-icon-part="hour"] { animation-duration: 96s; }
@keyframes stagger-spin { to { rotate: 360deg; } }

/* Route: draws in from the circle to the arrow, then the crosses land; every 5 s the crosses turn and the arrow nudges forward. */
[data-icon-part="line"] { stroke-dasharray: 1.02 2; stroke-dashoffset: 0; transition: stroke-dashoffset 1s cubic-bezier(.45,0,.2,1) calc(var(--stagger-delay, 0s) + .3s); }
[data-icon-part="arrow"] { transition: opacity .3s ease calc(var(--stagger-delay, 0s) + 1.15s); animation: stagger-nudge 5s ease-in-out calc(var(--stagger-delay, 0s) + 2.4s) infinite; }
[data-icon-part="cross"] { transform-origin: var(--o); transition: scale .5s cubic-bezier(.22,1,.36,1) calc(var(--stagger-delay, 0s) + var(--cd)), opacity .3s ease calc(var(--stagger-delay, 0s) + var(--cd)); animation: stagger-turn 5s cubic-bezier(.65,0,.35,1) calc(var(--stagger-delay, 0s) + 2s + var(--cd)) infinite; }
[data-stagger-motion="ready"] .stagger-cards_list > * > :not([data-stagger-in]) [data-icon-part="line"] { stroke-dashoffset: 1.03; }
[data-stagger-motion="ready"] .stagger-cards_list > * > :not([data-stagger-in]) [data-icon-part="arrow"] { opacity: 0; }
[data-stagger-motion="ready"] .stagger-cards_list > * > :not([data-stagger-in]) [data-icon-part="cross"] { opacity: 0; scale: .3; }
@keyframes stagger-turn { 0% { rotate: 0deg; } 14%, 100% { rotate: 180deg; } }
@keyframes stagger-nudge { 0%, 16%, 100% { translate: 0 0; } 8% { translate: .9px 0; } }

/* Loupe: sweeps back and forth as if it is searching, about 3.6 s per sweep. */
[data-icon-part="loupe"] { transform-origin: 16.5px 16.5px; animation: stagger-search 3.6s ease-in-out infinite; }
@keyframes stagger-search {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(-.9px, -.5px) rotate(-10deg); }
  50% { transform: translate(0, -.9px) rotate(0deg); }
  75% { transform: translate(.9px, -.5px) rotate(10deg); }
}
/* Shield breathes (2.8 s); ticks and clipboard rows draw, hold, fade, redraw; handshake shakes; outbound arrow leaves and returns. */
[data-icon-part="shield"] { transform-origin: 17.6px 16.7px; animation: stagger-breath 2.8s ease-in-out infinite; }
[data-icon-part="tick"], [data-icon-part="row"] { stroke-dasharray: 1.02 2; animation: stagger-draw 3.2s cubic-bezier(.45,0,.2,1) var(--rd, 0s) infinite backwards; }
[data-icon-part="row"] { animation-duration: 4s; }
[data-icon-part="shake"] { transform-origin: 12px 12px; animation: stagger-shake 3.6s ease-in-out infinite; }
[data-icon-part="out"] { animation: stagger-out 2.8s ease-in-out infinite; }
@keyframes stagger-breath { 0%, 100% { scale: 1; } 50% { scale: 1.12; } }
@keyframes stagger-draw { 0% { stroke-dashoffset: 1.03; opacity: 1; } 22% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; opacity: 1; } 94% { stroke-dashoffset: 0; opacity: 0; } 95%, 100% { stroke-dashoffset: 1.03; opacity: 0; } }
@keyframes stagger-shake { 0%, 32%, 100% { rotate: 0deg; } 8% { rotate: -6deg; } 16% { rotate: 5deg; } 24% { rotate: -3deg; } }
@keyframes stagger-out { 0%, 100% { translate: 0 0; } 50% { translate: .8px -.8px; } }
</style>
