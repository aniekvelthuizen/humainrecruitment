<script>
/* HumAIn nav, mobile panel: when a dropdown row opens (EN, Expertise, For business ...), scroll the panel so the opened list is fully in view, 16 px from the bottom. Without it a row near the bottom (the language switch) opens below the fold and nothing seems to happen. Waits for the 300 ms open animation; no requestAnimationFrame. Built by Aniek Velthuizen with Claude, 2026-11-12. */
(() => {
  const wrap = document.querySelector('[data-nav="component"] .nav_mobile_wrap');
  if (!wrap) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveal = (list) => {
    const scroller = list.closest('.nav_mobile_menu_scroll');
    if (!scroller) return;
    setTimeout(() => {
      const l = list.getBoundingClientRect(), s = scroller.getBoundingClientRect();
      const down = Math.min(l.bottom - s.bottom + 16, l.top - s.top - 16);
      if (down > 0) scroller.scrollBy({ top: down, behavior: reduce ? 'auto' : 'smooth' });
    }, 320);
  };
  new MutationObserver((ms) => ms.forEach((m) => {
    const t = m.target;
    if (t.classList.contains('w-dropdown-list') && t.classList.contains('w--open') && !(m.oldValue || '').includes('w--open')) reveal(t);
  })).observe(wrap, { subtree: true, attributes: true, attributeFilter: ['class'], attributeOldValue: true });
})();
</script>
