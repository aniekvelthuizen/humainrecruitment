<style>
/* Arrow link swap (decisions/motion.md, 2026-11-12). Tertiary Button Main with the Arrow Right icon only:
   on hover/focus the left arrow leaves, the label slides left, an arrow comes in on the right.
   Driven by the Lumos trigger (--_trigger---off: 0 rest, 1 hover/focus), so card hovers drive it too. */
[data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) {
  --arrow-link-shift: calc(1rem + 0.5rem); /* icon width + gap */
  --arrow-link-ease: cubic-bezier(.65,.05,.36,1);
  --arrow-link-time: calc(250ms + 200ms * var(--_trigger---off, 0)); /* in 450 ms, out 250 ms */
}
/* Inside a clickable card the card's link layer covers the button, so the card's hover/focus plays it */
:is([data-trigger~="hover"], [data-trigger~="hover-if-clickable"]:has(.clickable_wrap:not(.w-condition-invisible))):hover [data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]),
[data-trigger~="focus"]:is(:focus-visible, :has(:focus-visible)) [data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) {
  --_trigger---on: 0;
  --_trigger---off: 1;
}
[data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) .button_main_icon {
  transform: translateX(calc(-0.75rem * var(--_trigger---off, 0)));
  opacity: calc(1 - var(--_trigger---off, 0));
  transition: transform var(--arrow-link-time) var(--arrow-link-ease), opacity var(--arrow-link-time) ease;
}
[data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) :is(.button_main_text, .button_main_line) {
  translate: calc(-1 * var(--arrow-link-shift) * var(--_trigger---off, 0)) 0;
  transition-property: translate, transform, color;
  transition-duration: var(--arrow-link-time), 600ms, 200ms;
  transition-timing-function: var(--arrow-link-ease);
}
[data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) .button_main_element::after {
  content: "";
  position: absolute;
  right: 0;
  top: 50%;
  width: 1rem;
  height: 1rem;
  margin-top: -0.5rem;
  background-color: currentColor;
  -webkit-mask: url("https://cdn.prod.website-files.com/6ae35364a38b2d71cab8c607/6ae36cceffdd1ab2d2dbee0b_icon-arrow-right.svg") center / contain no-repeat;
  mask: url("https://cdn.prod.website-files.com/6ae35364a38b2d71cab8c607/6ae36cceffdd1ab2d2dbee0b_icon-arrow-right.svg") center / contain no-repeat;
  opacity: var(--_trigger---off, 0);
  transform: translateX(calc(-0.75rem * (1 - var(--_trigger---off, 0))));
  transition: transform var(--arrow-link-time) var(--arrow-link-ease), opacity var(--arrow-link-time) ease;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  [data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) .button_main_element::after,
  [data-wf--button-main--button-variant="tertiary"]:has([data-wf--icon-set--variant="arrow-right"]) :is(.button_main_icon, .button_main_text, .button_main_line) { transition-duration: 0s; }
}
</style>
