<style>
/* Header glow: the pink end of the brand gradient rises in on page load (decisions/motion.md, 2026-11-12).
   v4: one gradient, no extra layer. Two registered properties drive it: the blue stop itself (--header-glow-mid) rises
   from 90 % to 70.19 % while the end colour (--header-glow-end) turns from blue to pink. Like the original there is only
   one bend in the gradient (v3 had a flat blue band between two bends, which read as light/dark lines). The resting values are the original gradient; without the animation (Designer, reduced motion,
   no JS, no @property) the header simply shows it.
   Page Header: base, Vertical, Opportunity. Not Light / Split (own background) and not Search (gradient on _top). */
@property --header-glow-mid {
  syntax: "<percentage>";
  inherits: false;
  initial-value: 70.19%;
}
@property --header-glow-end {
  syntax: "<color>";
  inherits: false;
  initial-value: #e5bbb7;
}
.hero-experts_wrap,
.page-header_wrap:not(.w-variant-b8b2b4b4-5b82-4110-9cfb-ecc8eb7d219a, .w-variant-d882de9f-fac5-8823-1f14-1b87c802037e, .w-variant-f7e9ecff-6956-1a07-9a3d-da348da0246f),
.page-header_top.w-variant-f7e9ecff-6956-1a07-9a3d-da348da0246f {
  --header-glow-mid: 70.19%;
  --header-glow-end: var(--_theme---gradient--brand-end);
  background-image: linear-gradient(180deg, var(--_theme---gradient--brand-start) 0%, var(--_theme---gradient--brand-middle) var(--header-glow-mid), var(--header-glow-end) 100%);
}
@media (prefers-reduced-motion: no-preference) {
  html.w-mod-js:not(.wf-design-mode) .hero-experts_wrap,
  html.w-mod-js:not(.wf-design-mode) .page-header_wrap:not(.w-variant-b8b2b4b4-5b82-4110-9cfb-ecc8eb7d219a, .w-variant-d882de9f-fac5-8823-1f14-1b87c802037e, .w-variant-f7e9ecff-6956-1a07-9a3d-da348da0246f),
  html.w-mod-js:not(.wf-design-mode) .page-header_top.w-variant-f7e9ecff-6956-1a07-9a3d-da348da0246f {
    animation: header-glow-rise 2s cubic-bezier(.4, 0, .2, 1) .4s backwards;
  }
}
/* "to" is left out: the animation ends on the resting values above */
@keyframes header-glow-rise {
  from { --header-glow-mid: 90%; --header-glow-end: var(--_theme---gradient--brand-middle); }
}
</style>
