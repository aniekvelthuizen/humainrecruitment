<style>
[data-score-bar] > * { height: 100%; min-width: 0; flex-basis: 0%; }
[data-score-bar] > :nth-child(7n+1), [data-score-item]:nth-child(7n+1) .score-chart_dot { background-color: var(--_theme---chart--color-1); }
[data-score-bar] > :nth-child(7n+2), [data-score-item]:nth-child(7n+2) .score-chart_dot { background-color: var(--_theme---chart--color-2); }
[data-score-bar] > :nth-child(7n+3), [data-score-item]:nth-child(7n+3) .score-chart_dot { background-color: var(--_theme---chart--color-3); }
[data-score-bar] > :nth-child(7n+4), [data-score-item]:nth-child(7n+4) .score-chart_dot { background-color: var(--_theme---chart--color-4); }
[data-score-bar] > :nth-child(7n+5), [data-score-item]:nth-child(7n+5) .score-chart_dot { background-color: var(--_theme---chart--color-5); }
[data-score-bar] > :nth-child(7n+6), [data-score-item]:nth-child(7n+6) .score-chart_dot { background-color: var(--_theme---chart--color-6); }
[data-score-bar] > :nth-child(7n), [data-score-item]:nth-child(7n) .score-chart_dot { background-color: var(--_theme---chart--color-7); }
/* Reveal: segments grow left to right, rows fade in the same rhythm (no rise: in Safari a moved row makes a one-column legend taller) (script sets data-score-motion ready → in → done) */
[data-score-motion="in"] [data-score-bar] > * { transform-origin: 0 50%; transition: transform .7s cubic-bezier(.22,1,.36,1); transition-delay: calc(var(--i, 0) * .08s); }
[data-score-motion="in"] [data-score-item] { transition: opacity .6s cubic-bezier(.22,1,.36,1); transition-delay: calc(.15s + var(--i, 0) * .06s); }
[data-score-motion="ready"] [data-score-bar] > * { transform: scaleX(0); }
[data-score-motion="ready"] [data-score-item] { opacity: 0; }
/* Hover: the pointed row and its segment stay, the rest dims */
[data-score-chart]:not([data-score-motion="ready"]):not([data-score-motion="in"]) [data-score-bar] > *,
[data-score-chart]:not([data-score-motion="ready"]):not([data-score-motion="in"]) [data-score-item] { transition: opacity .25s ease; transition-delay: 0s; }
[data-score-item] .score-chart_dot { transition: scale .25s ease; }
[data-score-active] [data-score-bar] > :not([data-active]), [data-score-active] [data-score-item]:not([data-active]) { opacity: .35; }
[data-score-item][data-active] .score-chart_dot { scale: 1.3; }
</style>
