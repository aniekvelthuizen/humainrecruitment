<script>
/* Glass 3D — the glass ring and bar pictures become real 3D (Three.js), decisions/motion.md › Glass 3D.
   Built by Aniek Velthuizen with Claude, 2026-11-12. Source: references/embeds/glass-3d-script.html.
   Which pictures: an <img> whose file is in MODELS, or any <img data-glass-3d="donut|bars">.
   The picture stays as poster until the first 3D frame, then cross-fades; it also stays when
   WebGL or the CDN fails, with reduced motion, in the Designer and without IntersectionObserver. */
(() => {
  const MODELS = { '6aecbf15e512f468a8790720': 'donut', '6aec8809a21c0ac23d61166d': 'bars' };
  const CDN = 'https://cdn.jsdelivr.net/npm/three@0.169.0/';
  const de = document.documentElement;
  if (de.classList.contains('wf-design-mode') || !('IntersectionObserver' in window) ||
      matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let lib;
  const load = () => lib || (lib = Promise.all([
    import(CDN + '+esm'),
    import(CDN + 'examples/jsm/environments/RoomEnvironment.js/+esm'),
    import(CDN + 'examples/jsm/geometries/RoundedBoxGeometry.js/+esm')
  ]));

  const kindOf = (img) => img.dataset.glass3d ||
    MODELS[Object.keys(MODELS).find(k => (img.getAttribute('src') || '').includes(k))];

  const init = () => document.querySelectorAll('img').forEach(img => {
    const kind = kindOf(img);
    if (!kind || img.dataset.glass3dOn) return;
    img.dataset.glass3dOn = '';
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      load().then(m => mount(img, kind, m)).catch(err => console.warn('Glass 3D: poster kept', err));
    }, { rootMargin: '600px 0px' });
    io.observe(img);
  });

  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const easeOutQuint = (x) => 1 - (1 - x) ** 5;
  const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
  const easeInCubic = (x) => x * x * x;

  function mount(img, kind, [THREE, { RoomEnvironment }, { RoundedBoxGeometry }]) {
    const C = { pink: '#f2a9b6', white: '#e6e9f4', sky: '#a9d3ef', mint: '#3fe0cf', blue: '#2c86c2', lavender: '#a57fdb', purple: '#4b1ba8' };
    const BLEED = 0.25, GROW = 1 + 2 * BLEED;

    // Stage: an overlay on the picture's box, in the section (so the bleed is not cut off by the
    // picture's own wrapper), never catching the mouse.
    const host = img.closest('section') || img.parentElement;
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const stage = document.createElement('div');
    stage.setAttribute('data-glass-3d-stage', kind);
    stage.setAttribute('aria-hidden', 'true');
    stage.style.cssText = 'position:absolute;pointer-events:none;z-index:1;';
    host.appendChild(stage);
    // Follow the picture: re-measured every frame (not only on resize), so the stage stays on it
    // whatever moves the picture inside the section. Returns true when the size changed.
    let box = '', S = null;
    const placeStage = () => {
      const r = img.getBoundingClientRect(), h = host.getBoundingClientRect();
      const dy = S && S.offsetY ? S.offsetY(r) : 0;   // scroll-linked offset (sticky bars)
      const l = Math.round(r.left - h.left - host.clientLeft), tp = Math.round(r.top - h.top - host.clientTop + dy);
      const w = Math.round(r.width), ht = Math.round(r.height), next = `${l},${tp},${w},${ht}`;
      if (next === box) return false;
      const sized = !box.endsWith(`,${w},${ht}`);
      box = next;
      Object.assign(stage.style, { left: l + 'px', top: tp + 'px', width: w + 'px', height: ht + 'px' });
      return sized;
    };

    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
    catch (e) { stage.remove(); return; }
    const dark = kind === 'bars';
    if (dark) {
      // Glass refracts what is behind it; on a transparent canvas Three fills that with half-white,
      // which turns glass milky on a dark section. Use the section's own colour instead.
      const bg = getComputedStyle(host).backgroundColor;
      const backdrop = new THREE.Color(/rgba?\(0, 0, 0, 0\)|transparent/.test(bg) ? '#1e0057' : bg);
      const set = renderer.setClearColor.bind(renderer);
      renderer.setClearColor = (c, a) => (c === 0xffffff && a === 0.5) ? set(backdrop, 0.5) : set(c, a);
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth < 768 ? 1.5 : 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    const cv = renderer.domElement;
    cv.style.cssText = `position:absolute;left:${-BLEED * 100}%;top:${-BLEED * 100}%;width:${GROW * 100}%;height:${GROW * 100}%;opacity:0;transition:opacity .6s cubic-bezier(.22,1,.36,1);`;
    stage.appendChild(cv);

    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    if (!dark) {
      const key = new THREE.DirectionalLight('#ffffff', 1.4); key.position.set(-3, 6, 5); scene.add(key);
      scene.add(new THREE.AmbientLight('#ffffff', 0.35));
    } else {
      // Dark section: dimmed room (it drew white outlines on the edges), soft key, lavender back light.
      scene.environmentIntensity = 0.45;
      const key = new THREE.DirectionalLight('#efeaff', 1.5); key.position.set(-4, 7, 6); scene.add(key);
      const rim = new THREE.DirectionalLight('#9d82ff', 1.1); rim.position.set(5, 4, -7); scene.add(rim);
      scene.add(new THREE.HemisphereLight('#7a5cff', '#1e0057', 0.5));
    }

    function glass(hex, { transmission = 1, glow = 0, tint = 0.25 } = {}) {
      const own = new THREE.Color(hex), white = new THREE.Color('#ffffff');
      return new THREE.MeshPhysicalMaterial({
        color: own.clone().lerp(white, tint), metalness: 0, roughness: 0.1, transmission, thickness: 0.7, ior: 1.5,
        emissive: own, emissiveIntensity: glow, attenuationColor: own, attenuationDistance: 2.2,
        dispersion: dark ? 0 : 0.4, clearcoat: dark ? 0.35 : 1, clearcoatRoughness: dark ? 0.12 : 0.04,
        specularIntensity: dark ? 0.6 : 1, specularColor: dark ? own.clone().lerp(white, 0.35) : white,
        envMapIntensity: dark ? 0.75 : 1.2
      });
    }

    S = kind === 'bars' ? bars() : donut();
    const fov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(S.fov) / 2) * GROW);
    const camera = new THREE.PerspectiveCamera(THREE.MathUtils.radToDeg(fov), 1, 0.1, 100);
    camera.position.copy(S.cam); camera.lookAt(S.target);

    const resize = () => {
      placeStage();
      const w = stage.clientWidth * GROW, h = stage.clientHeight * GROW;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize); ro.observe(host); ro.observe(img);
    addEventListener('resize', resize); resize();

    // Loop only while in view and the tab is visible; t counts visible time only.
    let visible = false, raf = 0, last = 0, t = 0, shown = false, lastY = scrollY;
    const frame = (now) => {
      const dt = Math.min((now - last) / 1000, 0.05); t += dt; last = now;
      const scrollSpeed = dt ? (scrollY - lastY) / dt : 0; lastY = scrollY;   // px per second, + down / - up
      if (placeStage()) resize();
      S.tick(t, dt, scrollSpeed); renderer.render(scene, camera);
      if (!shown) {   // cross-fade from the poster after the first real frame
        shown = true;
        img.style.transition = 'opacity .6s cubic-bezier(.22,1,.36,1)';
        img.style.opacity = '0'; cv.style.opacity = '1';
      }
      raf = requestAnimationFrame(frame);
    };
    const update = () => {
      cancelAnimationFrame(raf);
      if (visible && !document.hidden) { last = performance.now(); lastY = scrollY; raf = requestAnimationFrame(frame); }
    };
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; update(); }, { rootMargin: '100% 0px' }).observe(img.parentElement);   // not the stage: the stage follows the picture
    document.addEventListener('visibilitychange', update);
    if (S.offsetY) addEventListener('scroll', () => { if (visible) placeStage(); }, { passive: true });   // sticky: follow the scroll itself, not only the next frame

    /* Donut: 7 segments, pieces float together on first view, one turn per 40 s. */
    function donut() {
      const D = { ...C, white: '#c3cbe6', sky: '#8cc4ee', pink: '#ee98aa', blue: '#1f86cc' };
      const parts = [['purple', 92], ['lavender', 62], ['blue', 66], ['mint', 52], ['sky', 36], ['white', 38], ['pink', 14]];
      const R0 = 1.75, R1 = 2.85, DEPTH = 0.55, BEVEL = 0.07, GAP = 0.07;
      const I = { delay: 0.15, gap: 0.12, dur: 1.9, out: 0.8, lift: 0.5, turn: 0.25 };
      const tilt = new THREE.Group(), spin = new THREE.Group();
      tilt.rotation.set(-0.38, -0.42, -0.05); tilt.add(spin); scene.add(tilt);
      const sector = (a0, a1, d) => {   // straight sides pulled in parallel: an even gap
        const i0 = Math.asin(d / R0), i1 = Math.asin(d / R1), s = new THREE.Shape();
        s.absarc(0, 0, R1, a0 + i1, a1 - i1, false); s.absarc(0, 0, R0, a1 - i0, a0 + i0, true); s.closePath();
        return s;
      };
      const pieces = [];
      let a = Math.PI / 2;
      for (const [name, deg] of parts) {
        const a1 = a, a0 = a - THREE.MathUtils.degToRad(deg), mid = (a0 + a1) / 2;
        const geo = new THREE.ExtrudeGeometry(sector(a0, a1, GAP / 2 + BEVEL),
          { depth: DEPTH, bevelEnabled: true, bevelThickness: 0.09, bevelSize: BEVEL, bevelSegments: 6, curveSegments: 64 });
        geo.translate(0, 0, -DEPTH / 2);
        const mesh = new THREE.Mesh(geo, glass(D[name]));
        spin.add(mesh);
        pieces.push({ mesh, dir: new THREE.Vector3(Math.cos(mid), Math.sin(mid), 0), i: pieces.length });
        a = a0;
      }
      // Spin: one turn per 40 s, clockwise. Scrolling down speeds it up clockwise (up to 7x), scrolling up
      // turns it the other way (up to 5x); afterwards it eases back to the calm clockwise turn.
      const BASE = Math.PI * 2 / 40, BOOST = 6, FULL = 1500;   // FULL: scroll speed (px/s) that gives the full boost
      let angle = 0, boost = 0;
      return {
        fov: 30, cam: new THREE.Vector3(0, 0, 11)   /* owner: a little smaller than the text column */, target: new THREE.Vector3(0, 0, 0),
        tick(t, dt, scrollSpeed) {
          const want = BOOST * Math.max(-1, Math.min(1, scrollSpeed / FULL));
          boost += (want - boost) * (1 - Math.exp(-dt * (Math.abs(want) > Math.abs(boost) ? 6 : 1.4)));   // quick up, slow settle
          angle += dt * BASE * (1 + boost);
          for (const p of pieces) {
            const off = 1 - easeOutQuint(clamp01((t - I.delay - p.i * I.gap) / I.dur));
            p.mesh.position.copy(p.dir).multiplyScalar(I.out * off);
            p.mesh.position.z = I.lift * off * (p.i % 2 ? 1 : -1);
            p.mesh.rotation.set(I.turn * off * p.dir.y, -I.turn * off * p.dir.x, 0);
            p.mesh.visible = t > I.delay + p.i * I.gap - 0.05;
          }
          spin.rotation.z = -angle;
          tilt.rotation.x = -0.38 + Math.sin(t * 0.35) * 0.03;
        }
      };
    }

    /* Bars: 7 bars pop up one by one, hold, sink back; a 6 s loop. */
    function bars() {
      const B = { ...C, purple: '#5a2fd4' };
      const order = ['pink', 'white', 'sky', 'mint', 'blue', 'lavender', 'purple'];
      const heights = [1.5, 2.1, 2.6, 3.0, 3.4, 4.1, 4.8];
      const W = 0.95, GAP = 0.22, n = order.length;
      const group = new THREE.Group(); scene.add(group);
      const list = order.map((name, i) => {
        const geo = new RoundedBoxGeometry(W, heights[i], W, 6, 0.1); geo.translate(0, heights[i] / 2, 0);
        const bar = new THREE.Mesh(geo, glass(B[name], { transmission: 0.6, glow: 0.3, tint: 0 }));
        bar.position.x = (i - (n - 1) / 2) * (W + GAP);
        group.add(bar);
        return bar;
      });
      const UP_GAP = 0.16, UP = 0.75, HOLD = 4.6, DOWN_GAP = 0.08, DOWN = 0.45, LOOP = 6;
      // Sticky (owner): the bars start over the title as designed; once their box is centred in the view
      // they stay there while the page scrolls, until the box top sits OVERLAP of its height above the
      // title's bottom: they end between the title and the text below, just over the title.
      const OVERLAP = 0.3;
      return {
        offsetY(r) {
          const title = img.parentElement.getBoundingClientRect(), next = img.parentElement.nextElementSibling;
          let end = title.bottom - r.height * OVERLAP - r.top;
          if (next) end = Math.min(end, next.getBoundingClientRect().top - r.height * 0.95 - r.top);   // never onto the text below
          return Math.max(0, Math.min(end, (innerHeight - r.height) / 2 - r.top));
        },
        fov: 30, cam: new THREE.Vector3(-5.5, 6, 16), target: new THREE.Vector3(-0.3, 2.2, 0),
        tick(t) {
          const lt = t % LOOP;
          list.forEach((bar, i) => {
            const k = easeOutBack(clamp01((lt - i * UP_GAP) / UP)) * (1 - easeInCubic(clamp01((lt - HOLD - i * DOWN_GAP) / DOWN)));
            bar.visible = k > 0.01;
            bar.scale.y = Math.max(0.001, k * (1 + Math.sin(t * 2.2 - i * 0.6) * 0.012));
          });
          group.rotation.y = Math.sin(t * 0.3) * 0.05;
        }
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
