<style>
/* Sticky Steps: every card in the list (or in the slot inside it) sticks at the intro's height, so the next one slides over it (a tilted stack). Kept here, not on Card Primary, so any card dropped in the slot gets it. */
[data-sticky-steps-list] > [role="listitem"], [data-sticky-steps-list] > * > [role="listitem"] { position: sticky; top: calc(var(--nav--height-total) + 2rem); rotate: -2deg; }
[data-sticky-steps-list] > [role="listitem"]:nth-child(even), [data-sticky-steps-list] > * > [role="listitem"]:nth-child(even) { rotate: 2deg; }
/* As the next card covers a card (--sticky-steps-cover 0..1, set below), its glass tint and text fade out, so the pile shows one layer of white and no text hazing through, as in the design. Ring and edge stay. */
[data-sticky-steps-list] [role="listitem"] .card_primary_element { background-color: color-mix(in srgb, var(--_theme---card--glass) calc((1 - var(--sticky-steps-cover, 0)) * 100%), transparent); }
[data-sticky-steps-list] [role="listitem"] :is(.card_primary_badge, .card_primary_header, .card_primary_text, .card_primary_list) { opacity: calc(1 - var(--sticky-steps-cover, 0)); }
/* Space Top medium / small and List Align end: off unless an instance sets them. Below 992 the section stays at section-space/main. */
/* Process Step (variant Plain): the design's growing white distance per step, only while the intro sticks beside the steps. No list height: the next section follows as soon as the last step lands (owner 2026-11-12). */
@media (min-width: 992px) {
[data-sticky-steps][data-space-top="medium" i] { padding-top: 11rem; }
[data-sticky-steps][data-space-top="small" i] { padding-top: 8rem; }
[data-sticky-steps][data-list-align="end" i] [data-sticky-steps-list] { margin-left: auto; }
/* Card stack: the list ends at the last card, so the stack and the section's bottom move on as soon as the last card lands (no hold). The space below the list (--sticky-steps-tail = intro height - last card height, set below) keeps the intro in place until then, and both leave together. */
[data-sticky-steps-list]:not(:has([data-process-step])) { align-self: start; margin-bottom: var(--sticky-steps-tail, 0px); }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(2) { padding-top: 13.75rem; }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(3) { padding-top: 19.5rem; }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(4) { padding-top: 25.25rem; }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(n+5) { padding-top: 31rem; }
/* Process Steps stick and pile up under each other: step n sticks one head lower (--sticky-steps-pitch = divider + 24 + 48 number + 24) than step n-1, and its white covers the body of the step above, so only the heads stay in view. top = intro top + (n-1) pitch - the step's own padding-top. */
[data-sticky-steps-list] > * > [data-process-step] { --sticky-steps-base: calc(var(--nav--height-total) + 2rem); --sticky-steps-pitch: calc(6rem + 1px); position: sticky; top: var(--sticky-steps-base); }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(2) { top: calc(var(--sticky-steps-base) + var(--sticky-steps-pitch) - 13.75rem); }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(3) { top: calc(var(--sticky-steps-base) + 2 * var(--sticky-steps-pitch) - 19.5rem); }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(4) { top: calc(var(--sticky-steps-base) + 3 * var(--sticky-steps-pitch) - 25.25rem); }
[data-sticky-steps-list] > * > [data-process-step]:nth-child(n+5) { top: calc(var(--sticky-steps-base) + 4 * var(--sticky-steps-pitch) - 31rem); }
[data-sticky-steps-list] > * > [data-process-step] .process-step_element { background-color: var(--_theme---background); }
}
</style>
<script>
(() => {
  if (window.__stickySteps) return; window.__stickySteps = true;
  const cardsOf = (list) => [...list.querySelectorAll(':scope > [role="listitem"], :scope > * > [role="listitem"]')];
  const lists = () => document.querySelectorAll('[data-sticky-steps-list]');
  let queued = false;
  const update = () => {
    queued = false;
    lists().forEach((list) => {
      const cards = cardsOf(list);
      cards.forEach((card, i) => {
        const next = cards[i + 1];
        let cover = 0;
        if (next) {
          const a = card.getBoundingClientRect(), b = next.getBoundingClientRect();
          cover = Math.min(1, Math.max(0, (a.bottom - b.top) / a.height));
        }
        card.style.setProperty('--sticky-steps-cover', cover.toFixed(3));
      });
    });
  };
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
  const tail = () => lists().forEach((list) => {
    const cards = cardsOf(list), last = cards[cards.length - 1];
    const intro = list.closest('[data-sticky-steps]')?.querySelector('.sticky-steps_intro');
    if (!last || !intro) return;
    list.style.setProperty('--sticky-steps-tail', Math.max(0, intro.offsetHeight - last.offsetHeight) + 'px');
  });
  /* Process Steps: each step box is stretched (padding-bottom, pulled back with the next step's margin-top, so the layout does not move) until all stuck boxes and the intro end on the same line (the intro too). Then the pile and the intro leave together instead of the last step sliding up over the heads. */
  const hold = () => lists().forEach((list) => {
    const steps = [...list.querySelectorAll(':scope > * > [data-process-step]')];
    const intro = list.closest('[data-sticky-steps]')?.querySelector('.sticky-steps_intro');
    steps.forEach((s) => { s.style.paddingBottom = ''; s.style.marginTop = ''; });
    if (intro && steps.length) intro.style.paddingBottom = '';
    if (!steps.length || getComputedStyle(steps[0]).position !== 'sticky') return;
    const bottoms = steps.map((s) => parseFloat(getComputedStyle(s).top) + s.offsetHeight);
    let end = Math.max(...bottoms);
    const introSticks = intro && getComputedStyle(intro).position === 'sticky';
    const introBottom = introSticks ? parseFloat(getComputedStyle(intro).top) + intro.offsetHeight : 0;
    end = Math.max(end, introBottom);
    /* The intro is stretched the same way (its cell is as tall as the list, so the layout does not move). */
    if (introSticks && end > introBottom) intro.style.paddingBottom = `calc(${getComputedStyle(intro).paddingBottom} + ${Math.round(end - introBottom)}px)`;
    steps.forEach((s, i) => {
      const x = Math.round(end - bottoms[i]);
      if (x <= 0) return;
      s.style.paddingBottom = x + 'px';
      if (steps[i + 1]) steps[i + 1].style.marginTop = -x + 'px';
    });
  });
  const start = () => {
    tail(); hold(); update();
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(() => { tail(); hold(); queue(); });
      lists().forEach((list) => {
        const cards = cardsOf(list), intro = list.closest('[data-sticky-steps]')?.querySelector('.sticky-steps_intro');
        if (intro) ro.observe(intro);
        if (cards.length) ro.observe(cards[cards.length - 1]);
        list.querySelectorAll(':scope > * > [data-process-step] .process-step_element').forEach((el) => ro.observe(el));
      });
    } else addEventListener('resize', tail);
  };
  addEventListener('scroll', queue, { passive: true });
  /* hold() on resize too, not only through the ResizeObserver: crossing 992 must clear the stretch at once. */
  addEventListener('resize', () => { hold(); queue(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
