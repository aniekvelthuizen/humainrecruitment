<style>
/* Quote reveal (decisions/motion.md): the words of a [data-quote-reveal] quote (and of each Facts Row figure) fly in one by one when it scrolls into view. Runtime only: the Designer shows the whole quote. */
html[data-quote-gate] [data-quote-reveal]:not([data-quote-state]),html[data-quote-gate] [data-facts-row] .card_primary_title:not([data-quote-state]){visibility:hidden}
[data-quote-word]{display:inline-block}
/* Card reveal (testimonial cards): quote mark pops in, stars light up one by one, text fades in as one block. */
html[data-quote-gate] [data-card-reveal]:not([data-card-state]) [data-card-reveal-part]{visibility:hidden}
</style>
<script>
(function(){
var d=document,h=d.documentElement;
if(h.classList.contains('wf-design-mode')||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
h.setAttribute('data-quote-gate','');
var release=function(){h.removeAttribute('data-quote-gate')};
var guard=setTimeout(release,4000);
function split(el){
  var walk=d.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[],n;
  while((n=walk.nextNode()))nodes.push(n);
  nodes.forEach(function(t){
    var f=d.createDocumentFragment();
    t.nodeValue.split(/([ \t\n\r]+)/).forEach(function(p){
      if(!p)return;
      if(/^[ \t\n\r]+$/.test(p)){f.appendChild(d.createTextNode(p));return}
      var s=d.createElement('span');s.setAttribute('data-quote-word','');s.textContent=p;f.appendChild(s);
    });
    t.parentNode.replaceChild(f,t);
  });
  return el.querySelectorAll('[data-quote-word]');
}
function init(){
  clearTimeout(guard);
  var g=window.gsap,els=d.querySelectorAll('[data-quote-reveal],[data-facts-row] .card_primary_title'),cards=d.querySelectorAll('[data-card-reveal]');
  if(!g||!(els.length||cards.length)){release();return}
  /* Order for things entering the view together: left to right, then top to bottom */
  var byPlace=function(a,b){var r=a.boundingClientRect,s=b.boundingClientRect;return Math.abs(r.left-s.left)>8?r.left-s.left:r.top-s.top};
  var part=function(c,n){return c.querySelector('[data-card-reveal-part="'+n+'"]')};
  var cio=new IntersectionObserver(function(es){
    es.filter(function(e){return e.isIntersecting}).sort(byPlace).forEach(function(e,i){
      cio.unobserve(e.target);
      var c=e.target,icon=part(c,'icon'),stars=part(c,'stars'),text=part(c,'text'),all=[];
      var tl=g.timeline({delay:i*0.15,onComplete:function(){g.set(all,{clearProps:'opacity,transform'});c.setAttribute('data-card-state','done')}});
      if(icon){all.push(icon);tl.to(icon,{opacity:1,scale:1,rotation:0,duration:0.6,ease:'back.out(2)'},0)}
      if(stars){var s=[].slice.call(stars.children).filter(function(x){return x.offsetWidth});all=all.concat(s);tl.to(s,{opacity:1,scale:1,duration:0.35,ease:'back.out(2.5)',stagger:0.06},0.15)}
      if(text){all.push(text);tl.to(text,{opacity:1,y:0,duration:0.6,ease:'power3.out'},0.25)}
    });
  },{rootMargin:'0px 0px -15% 0px'});
  [].forEach.call(cards,function(c){
    var icon=part(c,'icon'),stars=part(c,'stars'),text=part(c,'text');
    if(icon)g.set(icon,{opacity:0,scale:0.6,rotation:-12});
    if(stars)g.set([].slice.call(stars.children).filter(function(x){return x.offsetWidth}),{opacity:0,scale:0.5});
    if(text)g.set(text,{opacity:0,y:12});
    c.setAttribute('data-card-state','ready');
    cio.observe(c);
  });
  var num=function(el,a,f){var v=parseFloat(el.getAttribute(a));return isNaN(v)?f:v};
  var io=new IntersectionObserver(function(es){
    es.filter(function(e){return e.isIntersecting}).sort(byPlace).forEach(function(e,i){
      io.unobserve(e.target);
      var el=e.target,w=el._quoteWords;
      g.to(w,{opacity:1,y:0,ease:'power3.out',
        duration:num(el,'data-quote-reveal-duration',0.6),
        stagger:num(el,'data-quote-reveal-stagger',0.08),
        delay:i*num(el,'data-quote-reveal-next',0.3),
        onComplete:function(){g.set(w,{clearProps:'opacity,transform'});el.setAttribute('data-quote-state','done')}});
    });
  },{rootMargin:'0px 0px -15% 0px'});
  els.forEach(function(el){
    var w=el._quoteWords=split(el);
    g.set(w,{opacity:0,y:24});
    el.setAttribute('data-quote-state','ready');
    io.observe(el);
  });
}
d.readyState==='loading'?d.addEventListener('DOMContentLoaded',init):init();
})();
</script>
