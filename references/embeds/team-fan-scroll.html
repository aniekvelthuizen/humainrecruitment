<script>
/* Team Fan: turns the fan a little while the page scrolls (down = to the right). decisions/components/team-fan.md */
(() => {
  const fan = matchMedia('(min-width: 1200px) and (hover: hover)');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  document.querySelectorAll('[data-team-fan]').forEach((sec) => {
    const list = sec.querySelector('.team-fan_list');
    if (!list || document.documentElement.classList.contains('wf-design-mode')) return;
    let seen = false, raf = 0;
    const set = () => {
      raf = 0;
      if (!fan.matches || calm.matches) { list.style.removeProperty('--fan-shift'); return; }
      const r = sec.getBoundingClientRect(), vh = innerHeight;
      const p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
      list.style.setProperty('--fan-shift', (p - 0.5).toFixed(4));
    };
    const ask = () => { if (seen && !raf) raf = requestAnimationFrame(set); };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((e) => { seen = e[0].isIntersecting; ask(); }).observe(sec);
    } else seen = true;
    addEventListener('scroll', ask, { passive: true });
    addEventListener('resize', ask);
    fan.addEventListener('change', set);
    calm.addEventListener('change', set);
    set();
  });
})();
</script>
