<script>
/* Team Fan: turns the fan a little while the page scrolls (down = to the right), and keeps turning out for a moment after the scroll stops. decisions/components/team-fan.md */
(() => {
  const fan = matchMedia('(min-width: 1200px) and (hover: hover)');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const EASE = 0.05; // share of the remaining distance per 60 fps frame; lower = longer run-out
  document.querySelectorAll('[data-team-fan]').forEach((sec) => {
    const list = sec.querySelector('.team-fan_list');
    if (!list || document.documentElement.classList.contains('wf-design-mode')) return;
    let seen = false, raf = 0, cur = null, last = 0;
    const goal = () => {
      const r = sec.getBoundingClientRect(), vh = innerHeight;
      return Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height))) - 0.5;
    };
    const off = () => !fan.matches || calm.matches;
    const tick = (now) => {
      raf = 0;
      if (off()) { cur = null; list.style.removeProperty('--fan-shift'); return; }
      const g = goal();
      if (cur === null) cur = g;
      const dt = last ? Math.min(64, now - last) : 16.7;
      cur += (g - cur) * (1 - Math.pow(1 - EASE, dt / 16.7));
      if (Math.abs(g - cur) < 0.0005) { cur = g; last = 0; } else { last = now; raf = requestAnimationFrame(tick); }
      list.style.setProperty('--fan-shift', cur.toFixed(4));
    };
    const ask = () => { if (seen && !raf) { last = 0; raf = requestAnimationFrame(tick); } };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((e) => { seen = e[e.length - 1].isIntersecting; ask(); }).observe(sec);
    } else seen = true;
    addEventListener('scroll', ask, { passive: true });
    addEventListener('resize', ask);
    fan.addEventListener('change', ask);
    calm.addEventListener('change', () => { cur = null; ask(); });
    if (!off()) { cur = goal(); list.style.setProperty('--fan-shift', cur.toFixed(4)); }
  });
})();
</script>
